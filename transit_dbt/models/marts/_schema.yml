version: 2
models:
  - name: fct_boarding
    description: >
      Monthly hourly boarding/alighting per route and stop, 2024-01 onward.
      One row per (service_ym, route_no, stop_key, hour), matching the
      source primary key. Integer-range partitioned on service_ym.
    columns:
      - name: service_ym
        description: Service month as YYYYMM integer. Partition key.
        data_tests: [not_null]
      - name: service_month
        description: First day of the service month, for readability. Not the partition key.
        data_tests: [not_null]
      - name: hour
        data_tests: [not_null]
      - name: route_no
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_route')
                field: route_no
      - name: stop_key
        description: Stop ARS code. Includes virtual terminal '~' and Gyeonggi stops on purpose.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stop')
                field: stop_key

  - name: dim_route
    description: >
      One row per route. Most recent name wins; route_name_count shows renames.
      route_type is derived from the route number following the Seoul numbering scheme.
    columns:
      - name: route_no
        data_tests: [unique, not_null]
      - name: route_number
        description: Route number as shown to passengers, without 번 and the origin~terminus suffix.
      - name: route_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['trunk', 'branch', 'express', 'circular', 'night', 'village', 'autonomous', 'commuter', 'custom', 'ferry', 'other']
      - name: route_variant
        description: Trailing A or B marking a variant line (계통) of the same route number, e.g. 2115A / 2115B.
      - name: origin
        description: First terminus, parsed from the route name.
      - name: terminus
        description: Second terminus, parsed from the route name.

  - name: dim_stop
    description: >
      One row per stop ARS, with master match, coordinates and terrain.
      stop_name is the most recent name without the route ordinal suffix.
    columns:
      - name: stop_key
        data_tests: [unique, not_null]
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ars_exact', 'gyeonggi_unmatched', 'virtual_terminal']

  - name: dim_stop_name_history
    description: Every (stop, name) pair observed in the source, route ordinal removed, with first and last month seen.

  - name: route_stop_sequence
    description: >
      Ordinal of each stop along each route, parsed from the source name suffix.
      A route that passes a stop twice has two rows for that pair.
    columns:
      - name: route_no
        data_tests: [not_null]
      - name: stop_key
        data_tests: [not_null]
      - name: route_stop_seq
        data_tests: [not_null]
