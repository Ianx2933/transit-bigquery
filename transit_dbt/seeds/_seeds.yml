version: 2
seeds:
  - name: special_days
    description: >
      OD days that are not ordinary. public_holiday and major_holiday count as
      sunday_holiday. Every kind but public_holiday excludes the given scope
      (all / bus / ferry) from typical-day OD: a strike or a suspension, and the
      Seollal and Chuseok holidays, whose travel is unlike any Sunday's (Seollal
      2026-02-17 missed by 80% when predicted from Sundays).
      Only days that appear in the OD data need a row.
    config:
      column_types: {service_date: date, kind: string, scope: string, note: string}
    columns:
      - name: service_date
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: ['public_holiday', 'major_holiday', 'strike', 'ferry_suspension']
      - name: scope
        data_tests:
          - accepted_values:
              arguments:
                values: ['all', 'bus', 'ferry']
  - name: seoul_gu
    description: Seoul gu by the first five digits of adm_cd in admin_dong_boundary (statistical codes, 11010 = 종로구).
    config:
      column_types: {gu_code: string, gu_name: string}
    columns:
      - name: gu_code
        data_tests: [unique, not_null]
  - name: korea_public_holidays
    description: >
      Korean public holidays 2020-2027, copied from SeoulTransitPlatform
      (pipelines, korea_public_holidays.csv), where tests check it against the calendar.
    config:
      column_types: {holiday_date: date, holiday_name: string}
    columns:
      - name: holiday_date
        data_tests: [unique, not_null]
